services:
  db:
    image: postgres:16-alpine
    container_name: django-wiki-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_wiki}
      POSTGRES_USER: ${POSTGRES_USER:-django_wiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_wiki}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django_wiki} -d ${POSTGRES_DB:-django_wiki}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

